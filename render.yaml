services:
  - type: web
    name: docupilot-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py migrate
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_TRUST_PROXY_HTTPS
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DOCUPILOT_FRONTEND_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_SESSION_COOKIE_SAMESITE
        value: "None"
      - key: DJANGO_CSRF_COOKIE_SAMESITE
        value: "None"
